[project]
name = "systems-v1"
version = "0.1.0"
description = "Systems V1 --- a deterministic simulation of a methodology-driven autonomous analytical system."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Test-only, for Starlette TestClient. The refusal contract of the API
    # layer --- 400 for a rejected seed, 409 for a refused transition --- is
    # behaviour worth a test, and it can only be reached over HTTP.
    "httpx2>=0.29",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
